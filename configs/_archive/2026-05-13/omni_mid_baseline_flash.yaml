_base_: ../base.yaml
pipeline:
  task_adapter: math_ps
  benchmark: competition_math_ps
  memory_builder: none
  memory_retriever: none
  trajectory_policy: single_path
  provider: llmplus_openrouter
  inference_engine: math_reason
  feedback_engine: math_reason_gt
  evaluator: olympiad_eval
  artifact_sink: json_local
run:
  run_type: omni_mid_baseline_flash
  seed: 42
  max_passes: 1
  execution_mode: arc_batch
  retry_criterion: test
  retry_policy:
    max_passes: 1
    criterion: test
    error_feedback: all
    num_feedback_passes: 1
    include_past_outcomes: true
components:
  task_adapter:
    task_name: math_ps
  benchmark:
    data_root: data/omni_math
    types:
    - Olympiad
    levels:
    - Difficulty 4.0
    - Difficulty 4.5
    - Difficulty 5.0
    limit: 50
    require_integer_answer: false
    include_ids: []
  memory_builder: {}
  memory_retriever: {}
  trajectory_policy:
    retry_paths: 1
  provider:
    profile_name: llmplus_openrouter
    dotenv_path: .env
    default_max_concurrency: 32
  inference_engine:
    model: qwen/qwen3.5-flash-02-23
    gen_cfg:
      n: 1
      max_tokens: 16384
      batch_size: 32
      seed: 42
      ignore_cache: true
    error_feedback: all
    num_feedback_passes: 1
    include_past_outcomes: true
    include_reselected_lessons: false
    prompt_options: null
  feedback_engine: {}
  evaluator:
    judge_model: qwen/qwen3.5-flash-02-23
    judge_provider_profile: llmplus_openrouter
  artifact_sink: {}
