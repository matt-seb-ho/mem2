# COLM 2026 rebuttal — ACE seeded with 270 PS concepts (smoke3 on val100 sample).
# Frozen mode: no reflector/curator updates; retrieve from the projected 270-bullet
# playbook and feed top bullets into the inference engine.
_base_: ./arcmemo_arc_strict.yaml

pipeline:
  provider: llmplus_openrouter_dsv4f
  memory_builder: ace
  memory_retriever: ace

run:
  run_type: colm_rebuttal_ace_ps_seeded_smoke3_dsv4f
  strict_arcmemo_compat: false

components:
  provider:
    profile_name: llmplus_openrouter_dsv4f
  benchmark:
    data_root: data/arc_agi/evaluation
    include_ids:
      - 97239e3d
      - b7f8a4d8
      - '351d6448'
    limit: 3
  memory_builder:
    freeze: true
    max_bullets: 50
    use_ground_truth: false
    num_epochs: 1
    seed_memory_file: data/colm_rebuttal/ace_ps_seeded.json
  memory_retriever:
    max_bullets: 50
  inference_engine:
    model: deepseek/deepseek-v4-flash
    gen_cfg:
      batch_size: 3
      n: 1
      temperature: 0.3
      max_tokens: 16000
      top_p: 1.0
      seed: 88
      ignore_cache: false
    prompt_options:
      include_hint: true
      hint_template_key: selected
      instruction_key: default
      system_prompt_key: default
