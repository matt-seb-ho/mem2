_base_: ../base.yaml
pipeline:
  task_adapter: math_ps
  benchmark: competition_math_ps
  memory_builder: arcmemo_ps
  memory_retriever: ps_selector
  trajectory_policy: single_path
  provider: llmplus_openai
  inference_engine: math_reason
  feedback_engine: math_reason_gt
  evaluator: math_reason_eval
  artifact_sink: json_local
run:
  run_type: concept_math_reason_gpt5mini
  seed: 42
  max_passes: 2
  execution_mode: arc_batch
  retry_criterion: test
  retry_policy:
    max_passes: 2
    criterion: test
    error_feedback: all
    num_feedback_passes: 1
    include_past_outcomes: true
components:
  task_adapter:
    task_name: math_ps
  benchmark:
    data_root: data/competition_math_all_l5
    types:
      - "Algebra"
      - "Counting & Probability"
      - "Geometry"
      - "Intermediate Algebra"
      - "Number Theory"
      - "Prealgebra"
      - "Precalculus"
    limit: 0
  memory_builder:
    seed_memory_file: data/competition_math_all_l5/concept_memory_gpt41/extracted_v1.json
    domain: math
    max_concepts: 500
  memory_retriever:
    domain: math
  trajectory_policy:
    retry_paths: 1
  provider:
    profile_name: llmplus_openai
    dotenv_path: .env.example
    default_max_concurrency: 32
  inference_engine:
    model: gpt-5-mini
    gen_cfg:
      n: 1
      max_tokens: 4096
      batch_size: 32
      seed: 42
      ignore_cache: true
    error_feedback: all
    num_feedback_passes: 1
    include_past_outcomes: true
    include_reselected_lessons: false
    prompt_options: null
  feedback_engine: {}
  evaluator:
    require_all_tests: null
  artifact_sink: {}
