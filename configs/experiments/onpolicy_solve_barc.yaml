_base_: ../base.yaml

# Phase 1 of the on-policy concept-induction effort
# (docs/onpolicy_concept_induction_plan.md).
#
# Vanilla (no-memory, no-hint) solve of the 160 resolvable BARC seed puzzles with
# deepseek-v4-flash via the OFFICIAL DeepSeek API. The model solves the seeds from
# scratch — BARC .py solutions and their # concepts:/# description: annotations are
# NOT used (we only load the puzzle grids from data/arc_agi/training/<id>.json).
# Correct solves harvested here become the only ground truth for the induced library.

pipeline:
  task_adapter: arc_grid
  benchmark: arc_agi
  memory_builder: none          # no memory
  memory_retriever: none        # no hints
  router: none
  trajectory_policy: single_path
  provider: llmplus_deepseek_v4_flash
  inference_engine: python_transform_retry
  feedback_engine: gt_check
  evaluator: arc_exec
  artifact_sink: json_local

run:
  run_type: onpolicy_solve_barc
  execution_mode: arc_batch
  max_passes: 3
  retry_criterion: train
  retry_policy:
    max_passes: 3
    criterion: train
    error_feedback: all
    num_feedback_passes: 1
    include_past_outcomes: true
  strict_arcmemo_compat: false
  strict_arcmemo_logic_compat: false

components:
  task_adapter:
    task_name: arc_grid
  benchmark:
    data_root: data/arc_agi/training
