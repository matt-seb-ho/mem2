  memory_retriever: {}
  trajectory_policy:
    retry_paths: 1
  provider:
    profile_name: llmplus_deepseek_v4_flash
    dotenv_path: .env
    default_max_concurrency: 64   # preflight: clean through 128, 64 for headroom
  inference_engine:
    model: deepseek-v4-flash
    gen_cfg:
      n: 1
      temperature: 0.3
      max_tokens: 16384
      top_p: 1.0
      batch_size: 64
      ignore_cache: false
      expand_multi: null
    prompt_options:
      include_hint: false         # vanilla baseline — no concept hints
