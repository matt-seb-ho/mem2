# COLM 2026 rebuttal — RB seeded with 270 PS concepts (smoke3 on val100 sample).
# Frozen mode: no extractor updates; retrieve top-K items via Jaccard from the
# projected 270-item bank and feed into the inference engine.
_base_: ./arcmemo_arc_strict.yaml

pipeline:
  provider: llmplus_openrouter_dsv4f
  memory_builder: reasoning_bank
  memory_retriever: reasoning_bank

run:
  run_type: colm_rebuttal_rb_ps_seeded_smoke3_dsv4f
  strict_arcmemo_compat: false

components:
  provider:
    profile_name: llmplus_openrouter_dsv4f
  benchmark:
    data_root: data/arc_agi/evaluation
    include_ids:
      - 97239e3d
      - b7f8a4d8
      - '351d6448'
    limit: 3
  memory_builder:
    freeze: true
    seed_memory_file: data/colm_rebuttal/rb_ps_seeded.json
  memory_retriever:
    top_k: 3
    include_prev_attempt: false
  inference_engine:
    model: deepseek/deepseek-v4-flash
    gen_cfg:
      batch_size: 3
      n: 1
      temperature: 0.3
      max_tokens: 16000
      top_p: 1.0
      seed: 88
      ignore_cache: true
    prompt_options:
      include_hint: true
      hint_template_key: selected
      instruction_key: default
      system_prompt_key: default
