# COLM 2026 rebuttal — Dynamic Cheatsheet (DC-Cu) on dsv4f.
# Re-runs the paper's DC baseline (Suzgun 2025) on Deepseek-v4-flash via the
# new mem2 DC port. The DC port is built by the COLM rebuttal worker
# dispatch dc_port (2026-05-27).
_base_: ./arcmemo_arc_strict.yaml

pipeline:
  provider: llmplus_openrouter_dsv4f
  memory_builder: dc
  memory_retriever: dc

run:
  run_type: colm_rebuttal_dc_dsv4f
  strict_arcmemo_compat: false  # COLM rebuttal: intentionally on dsv4f, not gpt-4.1

components:
  provider:
    profile_name: llmplus_openrouter_dsv4f
  inference_engine:
    model: deepseek/deepseek-v4-flash
    prompt_options:
      include_hint: true
      hint_template_key: selected
