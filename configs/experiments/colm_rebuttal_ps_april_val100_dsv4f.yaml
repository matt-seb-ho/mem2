# COLM 2026 rebuttal — val100 PS @ APRIL PROTOCOL, post-timeout-fix (2026-05-29).
# Reproduces April one_shot (67.5/strict60) EXACTLY: arcmemo_ps + ps_topk(top_k=3) +
# 270-concept seed (compressed_v1.json) + default hint, max_passes=3, batch=32,
# max_tokens=16384. Single clean run: block (no duplicate-block bug). Verified
# subset = splits.json:eval_100 = paper's 100. Expectation: ~67.5 official.
_base_: ./arcmemo_arc_strict.yaml

run:
  run_type: colm_rebuttal_ps_april_val100_dsv4f
  max_passes: 3
  retry_criterion: train
  retry_policy:
    max_passes: 3
    criterion: train
    error_feedback: all
    num_feedback_passes: 1
    include_past_outcomes: true
  strict_arcmemo_compat: false
  strict_arcmemo_logic_compat: false
  seed: 42

pipeline:
  provider: llmplus_openrouter_dsv4f
  memory_builder: arcmemo_ps
  memory_retriever: ps_topk

components:
  provider:
    profile_name: llmplus_openrouter_dsv4f
    default_max_concurrency: 32
  memory_builder:
    seed_memory_file: data/arc_agi/concept_memory/compressed_v1.json
    domain: arc
    freeze_memory: true
  memory_retriever:
    top_k: 3
    include_description: true
    skip_cues: false
    skip_implementation: false
