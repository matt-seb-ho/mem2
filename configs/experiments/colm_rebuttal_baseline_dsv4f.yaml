# COLM 2026 rebuttal — baseline (no memory) on dsv4f.
# Re-runs the no-memory baseline on Deepseek-v4-flash via OpenRouter
# for the rebuttal cross-method comparison table.
_base_: ./arcmemo_arc_strict.yaml

pipeline:
  provider: llmplus_openrouter_dsv4f
  memory_builder: none
  memory_retriever: none

run:
  run_type: colm_rebuttal_baseline_dsv4f
  strict_arcmemo_compat: false  # COLM rebuttal: intentionally on dsv4f, not gpt-4.1

components:
  provider:
    profile_name: llmplus_openrouter_dsv4f
  benchmark:
    limit: 3  # n=3 smoke; flip to 100 (val100) for the full sweep
  inference_engine:
    model: deepseek/deepseek-v4-flash
    prompt_options:
      include_hint: false  # baseline: no memory hint
      instruction_key: default
      system_prompt_key: default
