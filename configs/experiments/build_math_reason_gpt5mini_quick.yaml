_base_: ../base.yaml
pipeline:
  task_adapter: math_ps
  benchmark: competition_math_ps
  memory_builder: none
  memory_retriever: none
  trajectory_policy: single_path
  provider: llmplus_openai
  inference_engine: math_reason
  feedback_engine: math_reason_gt
  evaluator: math_reason_eval
  artifact_sink: json_local
run:
  run_type: build_math_reason_gpt5mini_quick
  seed: 42
  max_passes: 2
  execution_mode: arc_batch
  retry_criterion: test
  retry_policy:
    max_passes: 2
    criterion: test
    error_feedback: all
    num_feedback_passes: 1
    include_past_outcomes: true
components:
  task_adapter:
    task_name: math_ps
  benchmark:
    data_root: data/competition_math_all_l5
    types:
      - "Algebra"
      - "Counting & Probability"
      - "Geometry"
      - "Intermediate Algebra"
      - "Number Theory"
      - "Prealgebra"
      - "Precalculus"
    limit: 0
    include_ids:
    - cmath_1005
    - cmath_10055
    - cmath_10114
    - cmath_10121
    - cmath_10128
    - cmath_10132
    - cmath_10133
    - cmath_10175
    - cmath_10214
    - cmath_10222
    - cmath_10240
    - cmath_10271
    - cmath_10273
    - cmath_1030
    - cmath_10325
    - cmath_10367
    - cmath_10387
    - cmath_10392
    - cmath_10411
    - cmath_1045
  memory_builder: {}
  memory_retriever: {}
  trajectory_policy:
    retry_paths: 1
  provider:
    profile_name: llmplus_openai
    dotenv_path: .env.example
    default_max_concurrency: 64
  inference_engine:
    model: gpt-5-mini
    gen_cfg:
      n: 1
      max_tokens: 4096
      batch_size: 64
      seed: 42
    error_feedback: all
    num_feedback_passes: 1
    include_past_outcomes: true
    include_reselected_lessons: false
    prompt_options: null
  feedback_engine: {}
  evaluator:
    require_all_tests: null
  artifact_sink: {}
